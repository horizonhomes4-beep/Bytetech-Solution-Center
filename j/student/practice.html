<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Topic Practice — MathCloud JAMB</title><link rel="stylesheet" href="../shared/styles.css">
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script><script>window.MathJax={loader:{load:['[tex]/ams','[tex]/mhchem']},tex:{inlineMath:[["\\(","\\)"],["$","$"]],displayMath:[["\\[","\\]"],["$$","$$"]],processEscapes:true,packages:{"[+]" : ["ams","mhchem"]}},chtml:{scale:1.05},options:{skipHtmlTags:["script","noscript","style","textarea","pre","code"]}};</script><script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script></head>
<body><header class="topbar"><div class="brand"><img src="../assets/logo.png" alt="MathCloud Tutorial logo"><span>MathCloud JAMB · Practice</span></div>
<div class="topnav"><a href="topics.html">Lessons</a><a href="results.html">Results</a><a href="dashboard.html">Dashboard</a></div></header>
<main class="container"><div id="notice" class="notice" hidden></div>
<section id="locked" class="card" hidden><h2>Subscription required</h2><p>Your active MathCloud JAMB subscription is required.</p></section>
<section id="app" hidden><div class="hero"><div class="row" style="justify-content:space-between"><div><p class="muted" style="margin:0">Topic practice</p><h1 id="title" style="margin:4px 0"></h1><p id="meta" style="margin:0;color:#dbeafe"></p></div><span id="progress" class="pill active">0/0</span></div></div>
<div id="practiceCard" class="card" style="margin-top:20px" hidden>
<div class="toolbar"><div><div class="muted" id="counter"></div><h2 id="question" style="margin:8px 0 0"></h2></div><button class="btn btn-secondary" id="closePractice" type="button">Close Practice</button></div>
<div id="options" style="margin-top:16px"></div><div id="feedback" class="notice" hidden></div><div id="practiceResult" class="notice success" hidden></div>
<div class="actions"><button class="btn btn-secondary" id="prev">Previous</button><button class="btn btn-primary" id="next">Next</button><button class="btn btn-secondary" id="flagBtn">Flag Question</button><button class="btn btn-dark" id="finish">Finish Practice</button><button class="btn btn-secondary" id="newSet" hidden>Retake — New Set</button></div>
<div class="card" style="margin-top:16px"><div id="paletteSummary" class="muted"></div><div class="actions" style="margin:10px 0"><button class="btn btn-secondary" id="showAnswered" type="button">All Answered</button><button class="btn btn-secondary" id="showFlagged" type="button">All Flagged</button><button class="btn btn-secondary" id="showAll" type="button">All Questions</button></div><div id="palette" class="actions" style="margin-top:10px"></div></div>
</div></section></main>
<script src="../shared/app-config.js"></script><script src="../shared/firebase-config.js"></script><script src="../shared/app.js"></script><script src="../shared/mathjax-renderer.js"></script><script src="../shared/calculator.js"></script><script>
let qs=[],index=0,answers={},flags=new Set(),finished=false,currentSubjectName="",currentTopicName="",resolvedTopicId="",currentUser=null,currentUserData=null,questionPool=[],sessionId=null,answerLocks={};
const params=new URLSearchParams(location.search),subjectId=params.get("subject")||"",requestedTopicId=params.get("topicId")||"",requestedTopic=params.get("topic")||"";
function lessonFor(bag,tid,tname){bag=bag||{};return bag[tid]||bag[topicKey(tid)]||bag[topicKey(tname)]||Object.values(bag).find(l=>l&&(String(l.topicId||l.topic_id||"")===String(tid)||String(l.id||"")===String(tid)||topicKey(l.topic)===topicKey(tname)||topicKey(l.topicName)===topicKey(tname)||topicKey(l.title)===topicKey(tname)))||null}
function getTopicEntries(subject){const raw=subject?.topics||{};if(Array.isArray(raw))return raw.map((x,i)=>typeof x==="string"?[topicKey(x)||String(i),x]:[String(x?.id||x?.topicId||topicKey(x?.name||x?.topic||x?.title)||i),String(x?.name||x?.topic||x?.title||i)]);return Object.entries(raw).map(([id,x])=>[id,typeof x==="string"?x:String(x?.name||x?.topic||x?.title||id)])}
function resolveTopic(subject){const e=getTopicEntries(subject);let h=e.find(x=>String(x[0])===String(requestedTopicId))||e.find(x=>topicKey(x[0])===topicKey(requestedTopicId))||e.find(x=>topicKey(x[1])===topicKey(requestedTopic));return h||[requestedTopicId||topicKey(requestedTopic),requestedTopic||requestedTopicId||"Topic"]}
function matching(all){return all.filter(q=>assessmentQuestionMatches(q,{subjectId,topicId:resolvedTopicId,topicName:currentTopicName}))}
function render(){const q=qs[index];if(!q)return;$("#counter").textContent=`Question ${index+1} of ${qs.length}`;$("#progress").textContent=`${index+1}/${qs.length}`;$("#question").innerHTML=mcMathTex(escapeHtml(q.question),subjectId);
$("#options").innerHTML=Object.entries(q.options||{}).map(([k,v])=>{const chosen=answers[index]===k,disabled=finished||!!answers[index];return `<label class="question-option ${chosen?"selected":""}"><input type="radio" name="answer" value="${escapeHtml(k)}" ${chosen?"checked":""} ${disabled?"disabled":""}> <strong>${escapeHtml(k)}.</strong> ${mcMathTex(escapeHtml(v),subjectId)}</label>`}).join("");
$$("#options input").forEach(x=>x.onchange=async()=>{if(answers[index])return;const selected=x.value;try{const ok=await lockAssessmentAnswer(currentUser?.uid,sessionId,index,selected);if(!ok)throw new Error("locked");answers[index]=selected;render()}catch(e){showNotice("This answer could not be locked. Please try again.","error")}});
addReadAloudButton($("#question"),()=>{const q=qs[index];const chosen=answers[index];const feedback=chosen?` Your selected answer is ${chosen}, ${q.options?.[chosen]||""}. ${q.correctAnswer===chosen?"Correct answer":"Correct answer"} is ${q.correctAnswer}, ${q.options?.[q.correctAnswer]||""}. ${q.explanation||q.solution||""}`:"";return q.question+". "+Object.entries(q.options||{}).map(([k,v])=>`${k}. ${v}`).join(". ")+feedback});
$("#feedback").hidden=!answers[index];if(answers[index])showFeedback();$("#prev").disabled=index===0;$("#next").disabled=index===qs.length-1;$("#finish").disabled=finished;$("#newSet").hidden=!finished;
$("#flagBtn").textContent=flags.has(index)?"Unflag Question":"Flag Question";$("#flagBtn").className=flags.has(index)?"btn btn-warning":"btn btn-secondary";renderPalette();mcTypesetSoon(document.getElementById("question"));mcTypesetSoon(document.getElementById("options"));}
function showFeedback(){const q=qs[index],chosen=answers[index];if(!chosen)return;const correct=chosen===q.correctAnswer;const correctText=q.options?.[q.correctAnswer]||"";$("#feedback").className=`notice ${correct?"success":"error"}`;$("#feedback").innerHTML=correct?`<strong>Answer locked.</strong> <strong>Correct.</strong> Correct option: <strong>${escapeHtml(q.correctAnswer)}</strong> — ${mcMathTex(escapeHtml(correctText),subjectId)}<br>${escapeHtml(q.explanation||q.solution||"No explanation was supplied for this question.")}`:`<strong>Answer locked.</strong> <strong>Not correct.</strong> Your selection cannot be changed: <strong>${escapeHtml(chosen)}</strong> — ${mcMathTex(escapeHtml(q.options?.[chosen]||""),subjectId)}<br>Correct option: <strong>${escapeHtml(q.correctAnswer)}</strong> — ${mcMathTex(escapeHtml(correctText),subjectId)}<br>${escapeHtml(q.explanation||q.solution||"No explanation was supplied for this question.")}`;addReadAloudButton($("#feedback"),()=>$("#feedback").innerText);mcTypesetSoon(document.getElementById("feedback"))}
function renderPalette(filter="all"){const answered=qs.filter((q,i)=>!!answers[i]).length,flagged=flags.size;$("#paletteSummary").textContent=`Answered ${answered}/${qs.length} · Unanswered ${qs.length-answered} · Flagged ${flagged}`;let ids=qs.map((q,i)=>i);if(filter==="answered")ids=ids.filter(i=>!!answers[i]);if(filter==="flagged")ids=ids.filter(i=>flags.has(i));$("#palette").innerHTML=ids.map((q,i)=>`<button type="button" class="btn ${answers[i]?"btn-primary":"btn-secondary"} ${flags.has(i)?"btn-warning":""}" data-jump="${i}">${i+1}</button>`).join("");$$("[data-jump]").forEach(b=>b.onclick=()=>{index=Number(b.dataset.jump);render()})}
async function loadSet(){
  try{
    const indexBag=await mcRead(`publicQuestionIndex/${subjectId}`,{ttl:60000});
    const indexRows=Object.entries(indexBag||{})
      .map(([id,v])=>({id:String(id),topicId:v?.topicId||"",topic:v?.topic||"",active:v?.active!==false}))
      .filter(v=>v.active && (String(v.topicId)===String(resolvedTopicId)||topicKey(v.topicId)===topicKey(resolvedTopicId)||topicKey(v.topic)===topicKey(currentTopicName)));
    let selectedIds=[];
    if(indexRows.length){
      const recent=await getRecentAssessmentQuestionIds(currentUser?.uid,"topic",`${subjectId}:${resolvedTopicId}`);
      const uniqueIds=[...new Set(indexRows.map(x=>x.id))];
      let available=uniqueIds.filter(id=>!recent.has(id));
      if(available.length<Math.min(20,uniqueIds.length))available=uniqueIds;
      selectedIds=fisherYates(available).slice(0,Math.min(20,available.length));
      const rows=await Promise.all(selectedIds.map(id=>mcRead(`publicQuestions/${id}`,{ttl:300000})));
      questionPool=rows.map((raw,i)=>normalizeAssessmentQuestion(raw,selectedIds[i])).filter(Boolean);
    }else{
      const bag=await mcQueryChild("publicQuestions","subject",subjectId,{ttl:120000});
      questionPool=matching(flattenAssessmentQuestions(bag||{}));
    }
    questionPool=matching(questionPool);
    if(!questionPool.length){showNotice("No usable questions were found for this topic.","warning");return false}
    qs=questionPool.length<=20?questionPool:await selectFreshAssessmentQuestions(questionPool,20,{uid:currentUser?.uid||null,mode:"topic",scopeKey:`${subjectId}:${resolvedTopicId}`});
    const seen=new Set();qs=qs.filter(q=>{const fp=questionFingerprint(q);if(seen.has(fp))return false;seen.add(fp);return true});
    index=0;answers={};answerLocks={};flags=new Set();finished=false;
    sessionId=await createAssessmentSession(currentUser.uid,{mode:"topic",scopeKey:`${subjectId}:${resolvedTopicId}`,subject:subjectId,topicId:resolvedTopicId,topic:currentTopicName,questionIds:qs.map(q=>q.id).filter(Boolean)});
    if(sessionId)sessionStorage.setItem("mcPracticeSession",sessionId);
    $("#practiceResult").hidden=true;$("#practiceCard").hidden=false;$("#finish").hidden=false;render();
    if(questionPool.length<20)showNotice(`This topic has ${questionPool.length} usable question${questionPool.length===1?"":"s"}. The available bank is shown without repeating a question within this set.`,"warning");
    return true;
  }catch(e){console.error(e);showNotice("The question bank could not be loaded. Please try again.","error");return false}
}
async function finish(){if(finished||!qs.length)return;const answered=qs.filter((q,i)=>answers[i]).length;if(answered<qs.length&&!confirm(`You have ${qs.length-answered} unanswered question${qs.length-answered===1?"":"s"}. Finish anyway?`))return;let correct=0;const subjectStats={};const topicStats={};
qs.forEach((q,i)=>{const sid=q.subject||subjectId,t=q.topic||q.topicName||currentTopicName;const ok=answers[i]===q.correctAnswer;if(ok)correct++;if(!subjectStats[sid])subjectStats[sid]={subject:sid,subjectName:q.subjectName||sid,correct:0,total:0};subjectStats[sid].total++;if(ok)subjectStats[sid].correct++;const tk=`${sid}::${t}`;if(!topicStats[tk])topicStats[tk]={subject:sid,subjectName:q.subjectName||sid,topic:t,correct:0,total:0};topicStats[tk].total++;if(ok)topicStats[tk].correct++});
const pct=assessmentPercentage(correct,qs.length);try{const questionIds=qs.map(q=>q.id).filter(Boolean);await db.ref(`studentAttempts/${currentUser.uid}`).push({mode:"topic",scopeKey:`${subjectId}:${resolvedTopicId}`,subject:subjectId,subjectName:currentSubjectName,topicId:resolvedTopicId,topic:currentTopicName,score:correct,total:qs.length,percentage:pct,correctCount:correct,incorrectCount:qs.length-correct,unansweredCount:qs.length-answered,flaggedCount:flags.size,questionIds,subjectBreakdown:subjectStats,topicBreakdown:topicStats,completedAt:firebase.database.ServerValue.TIMESTAMP});try{await rememberAssessmentQuestions(currentUser.uid,questionIds)}catch(historyError){console.warn("Question history sync failed; attempt remains saved.",historyError)}await closeAssessmentSession(currentUser.uid,sessionId);sessionStorage.removeItem("mcPracticeSession");finished=true;render();$("#practiceResult").innerHTML=`<strong>Practice complete.</strong> ${correct}/${qs.length} correct (${pct.toFixed(1)}%). Answered ${answered}/${qs.length}; flagged ${flags.size}. Your result has been saved.`;$("#practiceResult").hidden=false}catch(e){console.error(e);showNotice("Your result could not be saved. Please try again.","error")}}
$("#prev").onclick=()=>{if(index>0){index--;render()}};$("#next").onclick=()=>{if(index<qs.length-1){index++;render()}};$("#flagBtn").onclick=()=>{flags.has(index)?flags.delete(index):flags.add(index);render()};$("#finish").onclick=finish;$("#newSet").onclick=()=>loadSet();$("#showAnswered").onclick=()=>renderPalette("answered");$("#showFlagged").onclick=()=>renderPalette("flagged");$("#showAll").onclick=()=>renderPalette("all");$("#closePractice").onclick=()=>{if(window.opener&&!window.opener.closed)window.close();else location.href="topics.html"};
requireStudentAuth(async(user,data)=>{currentUser=user;currentUserData=data;if(!subscriptionActive(data)){$("#locked").hidden=false;return}if(!subjectId){showNotice("Select a subject and topic first.","warning");return}try{const s=await mcRead(`subjects/${subjectId}`,{ttl:120000})||{};const [tid,tname]=resolveTopic(s);resolvedTopicId=tid;currentTopicName=tname;currentSubjectName=s.name||subjectId;$("#title").textContent=tname;$("#meta").textContent=currentSubjectName;$("#app").hidden=false;McCalculator.setSubject(subjectId);$("#closePractice").onclick=()=>{if(window.opener&&!window.opener.closed)window.close();else location.href="topics.html"};$("#flagBtn").onclick=()=>{flags.has(index)?flags.delete(index):flags.add(index);render()};$("#newSet").onclick=loadSet;$("#showAnswered").onclick=()=>renderPalette("answered");$("#showFlagged").onclick=()=>renderPalette("flagged");$("#showAll").onclick=()=>renderPalette("all");await loadSet()}catch(e){console.error(e);showNotice("Practice could not be loaded from Firebase.","error")}});</script></body></html>
